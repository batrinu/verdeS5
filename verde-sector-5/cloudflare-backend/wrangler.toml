# Verde în Sectorul 5 - Cloudflare Workers Configuration
name = "verde-sector-5-api"
main = "src/index.ts"
compatibility_date = "2024-04-05"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
JWT_EXPIRY = "7d"
REFRESH_TOKEN_EXPIRY = "30d"

[[d1_databases]]
binding = "DB"
database_name = "verde-sector-5-db"
database_id = "c9685e24-748a-412c-955e-37a46b8bb063"

# R2 not yet enabled on the account (photo uploads only). Re-enable this binding
# after activating R2 in the Cloudflare dashboard.
# [[r2_buckets]]
# binding = "PHOTOS"
# bucket_name = "verde-sector-5-photos"

[env.production]
[env.production.vars]
ENVIRONMENT = "production"

[[env.production.routes]]
pattern = "api.verde-sector5.ro/*"
zone_name = "verde-sector5.ro"

[env.staging]
[env.staging.vars]
ENVIRONMENT = "staging"

[[env.staging.routes]]
pattern = "staging-api.verde-sector5.ro/*"
zone_name = "verde-sector5.ro"
